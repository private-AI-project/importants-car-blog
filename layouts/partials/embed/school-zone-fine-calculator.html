    <form id="school-zone-form" class="calc-form">
      <div class="calc-field">
        <label for="violationType">위반 유형</label>
        <select id="violationType" name="violationType">
          <option value="speed">속도위반</option>
          <option value="signal">신호위반</option>
          <option value="parking">주정차</option>
        </select>
      </div>

      <div class="calc-field" id="speedBandField">
        <label for="speedBand">초과 속도 구간</label>
        <select id="speedBand" name="speedBand">
          <option value="under20">20km/h 이하</option>
          <option value="under40">20~40km/h</option>
          <option value="under60">40~60km/h</option>
          <option value="over60">60km/h 초과</option>
        </select>
      </div>

      <div class="calc-field" id="enforcementField">
        <label for="enforcement">단속 방식</label>
        <select id="enforcement" name="enforcement">
          <option value="camera">무인카메라 단속 (과태료)</option>
          <option value="manual">현장 적발 (범칙금 + 벌점)</option>
        </select>
        <p class="calc-hint">과태료는 차량 명의자에게, 범칙금은 운전자에게 부과되며 벌점이 함께 따라옵니다.</p>
      </div>

      <div class="calc-field" id="parkingDurationField" hidden>
        <label for="parkingDuration">주정차 시간</label>
        <select id="parkingDuration" name="parkingDuration">
          <option value="under2h">2시간 이내</option>
          <option value="over2h">2시간 초과</option>
        </select>
      </div>

      <div class="calc-field">
        <label><input type="checkbox" id="voluntaryPay" name="voluntaryPay"> 자진납부 예정 (과태료 20% 감경)</label>
        <p class="calc-hint">감경은 과태료에만 적용됩니다. 범칙금(현장 적발)에는 적용되지 않습니다.</p>
      </div>

      <button type="submit" class="calc-submit">예상 금액 계산하기</button>
    </form>

    <div id="calc-result" class="calc-result" hidden></div>
